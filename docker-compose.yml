services:
  db:
    image: postgres:17
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - langgraph-network

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - langgraph-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # API REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - langgraph-network

  langgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-api
    ports:
      - "8000:8000"  # API FastAPI
      - "5678:5678"  # Porta de debug remoto (debugpy)
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=empresa_m_regras
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
    env_file:
      - .env
    volumes:
      - ./src:/app/src  # Para desenvolvimento com hot-reload
    depends_on:
      - db
      - qdrant
    restart: unless-stopped
    networks:
      - langgraph-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ingestion-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingestion-service
    ports:
      - "8001:8001"  # API do serviço de ingestão
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=empresa_m_regras
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INGESTION_DOCS_PATH=/app/docs_regras
      - INGESTION_SCHEDULE_TIME=${INGESTION_SCHEDULE_TIME:-06:00}
      - INGESTION_API_PORT=8001
    env_file:
      - .env
    volumes:
      - ./docs_regras:/app/docs_regras  # Montar pasta de documentos
      - ./services:/app/services  # Montar serviço de ingestão
      - ./src:/app/src  # Para importar módulos do projeto
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - langgraph-network
    command: python -m uvicorn services.ingestion.api:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ingestion-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingestion-scheduler
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=empresa_m_regras
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INGESTION_DOCS_PATH=/app/docs_regras
      - INGESTION_SCHEDULE_TIME=${INGESTION_SCHEDULE_TIME:-06:00}
    env_file:
      - .env
    volumes:
      - ./docs_regras:/app/docs_regras  # Montar pasta de documentos
      - ./services:/app/services  # Montar serviço de ingestão
      - ./src:/app/src  # Para importar módulos do projeto
    depends_on:
      - qdrant
      - ingestion-service
    restart: unless-stopped
    networks:
      - langgraph-network
    command: python services/ingestion/scheduler.py

volumes:
  db_data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  langgraph-network:
    driver: bridge
